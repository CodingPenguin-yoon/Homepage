<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
<title id="title">Home Lab — 서비스 접속과 네트워크 구성</title>
<desc id="desc">외부 사용자는 OCI Reverse Proxy와 WireGuard를 통해 ORANGE 공개 서비스 영역에 접속합니다. IPFire는 GREEN 관리·스토리지, RED 테스트, ORANGE 공개 서비스 영역을 분리합니다. ORANGE에서 GREEN과 RED로의 접근은 차단합니다. Proxmox 3노드에서 Linux VM과 서비스를 운영하며 NAS와 NFS를 사용합니다. 논리 구성도이며 물리 배선도는 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#777770"/></marker></defs>
<style>text{font-family:Inter,'IBM Plex Sans KR',Arial,sans-serif;fill:#20201e}.label{font-size:12px;letter-spacing:2px;fill:#72726b}.name{font-size:23px;font-weight:500}.sub{font-size:16px;fill:#62625d}.small{font-size:14px;fill:#62625d}.line{fill:none;stroke:#aaa9a2;stroke-width:1.3}.box{fill:#faf9f6;stroke:#c9c8c0;stroke-width:1}.white{fill:#fff;stroke:#c9c8c0;stroke-width:1}</style>
<rect width="960" height="800" fill="#faf9f6"/>
<text x="40" y="46" class="label">HOME LAB / LOGICAL ARCHITECTURE</text>
<text x="40" y="85" font-size="29" font-weight="500">직접 구축하고, 운영하는 인프라</text>
<text x="920" y="46" text-anchor="end" class="label">01 — ACCESS</text>

<rect x="40" y="126" width="210" height="98" class="white"/>
<text x="62" y="162" class="label">EXTERNAL</text><text x="62" y="198" class="name">Client</text>
<path d="M250 175 H300" class="line" marker-end="url(#arrow)"/>
<rect x="302" y="126" width="278" height="98" class="white"/>
<text x="324" y="162" class="label">ORACLE CLOUD</text><text x="324" y="198" class="name">OCI Reverse Proxy</text>
<path d="M580 175 H637" class="line" marker-end="url(#arrow)"/>
<rect x="640" y="126" width="280" height="98" fill="#20201e"/>
<text x="663" y="162" style="fill:#bdbdb5" font-size="12" letter-spacing="2">VPN TUNNEL</text><text x="663" y="198" style="fill:#faf9f6" font-size="23">WireGuard</text>
<path d="M780 224 V351" class="line" marker-end="url(#arrow)"/>
<text x="798" y="252" class="small">서비스 접속</text>

<rect x="40" y="274" width="880" height="322" fill="none" stroke="#aaa9a2"/>
<text x="62" y="312" class="name">IPFire</text><text x="159" y="311" class="sub">네트워크 영역 분리</text>


<rect x="60" y="352" width="270" height="171" class="white"/>
<text x="81" y="383" class="label">GREEN / NIC 1</text><text x="81" y="419" class="name">관리 · 스토리지</text>
<text x="81" y="458" class="sub">Proxmox 관리</text><text x="81" y="487" class="sub">NAS + NFS VM</text>

<rect x="345" y="352" width="270" height="171" class="white"/>
<text x="366" y="383" class="label">RED / NIC 2</text><text x="366" y="419" class="name">테스트</text>
<text x="366" y="458" class="sub">Internal Heimdall</text><text x="366" y="487" class="sub">DNS + Reverse Proxy</text>

<rect x="630" y="352" width="270" height="171" class="white"/>
<text x="651" y="383" class="label">ORANGE / NIC 3</text><text x="651" y="419" class="name">공개 서비스 · DMZ</text>
<text x="651" y="458" class="sub">WireGuard Gateway</text><text x="651" y="487" class="sub">Public Service VMs</text>

<text x="62" y="568" class="small">접근 정책</text><text x="170" y="568" font-size="15">RED → ORANGE 허용</text><text x="470" y="568" font-size="15">ORANGE → GREEN / RED 차단</text>

<rect x="40" y="631" width="880" height="122" fill="#efeee9"/>
